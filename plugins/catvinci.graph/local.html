<!doctype html>
<html lang="{{lang}}" data-local="true">
  <head>
    <link rel="stylesheet" href="textus-resource:graph.css" />
  </head>
  <body>
    <div class="tx-bar" id="bar">
      <span id="stats"></span>
      <span class="tx-spacer"></span>
      <button class="tx-button small" id="full"></button>
      <button id="settings" class="tx-icon-button" aria-expanded="false"><span class="tx-icon" data-icon="sliders"></span></button>
    </div>
    <p id="status" class="tx-empty"></p>
    <div class="stage">
      <canvas id="graph"></canvas>
      <form id="panel" hidden></form>
    </div>
    <script src="textus-resource:graph-view.js"></script>
    <script src="textus-resource:page.js"></script>
  </body>
</html>
