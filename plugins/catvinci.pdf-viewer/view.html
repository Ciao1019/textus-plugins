<!doctype html>
<html lang="{{lang}}">
  <head>
    <link rel="stylesheet" href="textus-resource:view.css" />
  </head>
  <body>
    <div class="tx-bar" id="bar">
      <button class="tx-icon-button" id="prev"><span class="tx-icon" data-icon="left"></span></button>
      <input class="tx-input" id="page" type="number" min="1" value="1" />
      <span id="count">/ 0</span>
      <button class="tx-icon-button" id="next"><span class="tx-icon" data-icon="right"></span></button>
      <span class="tx-spacer"></span>
      <span id="find-box" hidden>
        <input class="tx-input" id="find" type="search" />
        <span id="find-count"></span>
      </span>
      <button class="tx-icon-button" id="find-open"><span class="tx-icon" data-icon="search"></span></button>
      <button class="tx-icon-button" id="zoom-out"><span class="tx-icon" data-icon="minus"></span></button>
      <button class="tx-button small" id="zoom">100%</button>
      <button class="tx-icon-button" id="zoom-in"><span class="tx-icon" data-icon="plus"></span></button>
    </div>
    <main id="viewer"></main>
    <p id="status" class="tx-empty"></p>
    <script type="module">
      // PDF.js's worker runs here rather than in a worker of its own: a
      // sandboxed frame can't start a module worker. pdf.js finds it on
      // globalThis.pdfjsWorker and parses on this thread.
      import * as worker from "textus-resource:lib/pdf.worker.min.mjs";
      import * as pdfjs from "textus-resource:lib/pdf.min.mjs";
      globalThis.pdfjsWorker = worker;
      window.pdfjsLib = pdfjs;
      window.dispatchEvent(new Event("pdfjs-ready"));
    </script>
    <script src="textus-resource:view.js"></script>
  </body>
</html>
